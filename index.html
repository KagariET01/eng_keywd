<!DOCTYPE html>
<html lang="zh-TW">

	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link id="style_css" rel="stylesheet" type="text/css" href="./style.css">
	</head>

	<body>
		<div class="floor" style="z-index:1;" id="main_body">
			<div class="box wrong" id="announcement" style="display:block;">
				Danger Box simple
			</div>
			<div class="box mainbox" id="create_exam">
				<h1>建立考卷</h1>
				<div class="box" id="qbook">
					<h2>上傳題庫</h2>
					<hr>
					<div>
						<select id="file_type" onchange="changeFileType()" required>
							<option value="" selected>選擇題庫讀取器</option>
							<option value="costom">自行上傳題庫讀取器</option>
						</select>
						<button id="book_type_file" class="update_file">新增檔案</button>
					</div>
					<input id="book_file" type="file" />
				</div>
				<div class="box" id="cfg">
					<h2>設定考卷</h2>
					<hr>
					<select id="exam_cfg_manager" required onchange="changeCFGType()">
						<option value="" disabled selected>選擇考卷設定器</option>
					</select>
					<div id="cfg_manager" class="cfg_top">

					</div>
				</div>
			</div>
			<div class="box mainbox" id="load_exam">
				<h1>載入考卷</h1>
				<button id="load_last_exam">載入上次未完成的考卷</button>
				<input id="exam_file" type="file" />
			</div>
			<div id="nowq" class="box mainbox">
				<p>
					題目here
				</p>
				<p>選項1</p>
				<p>選項2</p>
				<p>選項3</p>
				<p>選項4</p>
				<button id="nextq">下一題</button>
			</div>
		</div>



		<button class="floor sec_floor" style="z-index:2;border:none;display:none;" id="big_file_update">
			<div class="box" id="big_file_update_box">
				<h1>把檔案拖曳到這裡</h1>
				<h2>或是點擊這裡選擇檔案</h2>
			</div>
		</button>
		<div class="floor sec_floor" style="z-index:3;display:none" id="warning_box"></div>


		<script type="module">
			import * as script from "./script.js";
			import * as cfg_ui_gen from "/mods/addon/cfg_ui_generator/index.js";
			let mods={};
			mods.exam_cfg={};
			mods.exam_cfg.eng_keyword=import("/mods/addon/exam_cfg/eng_keyword/index.js");

			for(const [key,value] of Object.entries(script)){
				window[key]=value;
			}
		</script>
	</body>

</html>
